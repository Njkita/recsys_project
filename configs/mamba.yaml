seed: 42
model:
  name: mamba4rec
  d: 128
  n_blocks: 2
  d_state: 32
  d_conv: 4
  expand: 2
  dropout: 0.1
  ffn_mult: 4
  max_len: 200
  use_side: true
  side_use_genome: true
  side_dropout: 0.1
loss:
  name: sampled_softmax
  n_neg: 256
  gbce_t: 0.75
  sampling: uniform
  in_batch_negatives: false
aug:
  sse_pt_p: 0.1
training:
  batch_size: 256
  eval_batch_size: 1024
  num_workers: 8
  lr: 0.001
  weight_decay: 0.0
  warmup_frac: 0.01
  min_lr_ratio: 1.0
  ema_decay: 0.0
  grad_clip: 1.0
  max_epochs: 100
  eval_every_epochs: 1
  early_stop_patience: 10
  log_every_steps: 200
eval:
  ks:
  - 5
  - 10
  - 20
