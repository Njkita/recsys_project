seed: 42
model:
  name: fmlp
  d: 128
  n_blocks: 3
  max_len: 200
  dropout: 0.5
  ffn_mult: 4
  use_side: true
  side_use_genome: true
  side_dropout: 0.1
loss:
  name: gbce
  n_neg: 256
  gbce_t: 0.75
  sampling: uniform
  in_batch_negatives: false
aug:
  sse_pt_p: 0.1
training:
  batch_size: 256
  eval_batch_size: 1024
  num_workers: 8
  lr: 0.001
  weight_decay: 0.01
  warmup_frac: 0.05
  min_lr_ratio: 0.01
  ema_decay: 0.999
  grad_clip: 1.0
  max_epochs: 100
  eval_every_epochs: 1
  early_stop_patience: 10
  log_every_steps: 200
eval:
  ks:
  - 5
  - 10
  - 20
